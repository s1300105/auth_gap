[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authgap"
version = "0.1.0"
description = "Static inference of model-effective authority in Python LLM agents"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["authgap*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
